<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="OASIS Freight"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>OASIS Freight Tracker</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#171717;background:#f7f7f7}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}main{max-width:750px;margin:auto;padding:20px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.top h1{font-size:26px;letter-spacing:-.9px;margin:0}.muted{color:#777}.small{font-size:13px}.pill{border:0;border-radius:30px;padding:10px 16px;background:#111;color:white}.secondary{background:#eee;color:#222}.danger{background:#fff0ed;color:#a32b18}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:22px 0}.metric{background:#eee;border-radius:17px;padding:15px 12px}.metric .value{font-size:23px;font-weight:750;letter-spacing:-.6px;margin-top:8px;overflow-wrap:anywhere}.metric .small{color:#666}.tabs{display:flex;gap:5px;overflow:auto;margin:14px 0 18px}.tabs button{border:0;border-radius:25px;background:transparent;color:#777;padding:9px 13px;white-space:nowrap}.tabs button.active{background:#e8e8e8;color:#111}.card{background:#fff;border:1px solid #e3e3e3;border-radius:18px;padding:17px;margin:12px 0}.card-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.card-title strong{font-size:18px}.status{font-size:12px;border-radius:20px;padding:5px 9px;background:#eee;color:#555;white-space:nowrap}.status.Loading,.status.Picked{background:#fff0e8;color:#a45223}.status.Returned,.status.Completed,.status.Onboard{background:#e6f5e9;color:#257344}.detail{margin-top:14px;border-top:1px solid #eee;padding-top:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.panel{background:#f0f0f0;border-radius:20px;padding:18px;margin:15px 0}.panel h2{font-size:20px;margin:0 0 12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field.full{grid-column:1/-1}label{font-size:13px;color:#555}input,select,textarea{width:100%;min-width:0;border:1px solid #d2d2d2;border-radius:13px;background:#fff;padding:12px;color:#151515}input[type=checkbox]{width:auto;accent-color:#111}textarea{min-height:65px}.fullbtn{width:100%;margin-top:15px;background:#111;color:#fff;border:0;border-radius:22px;padding:14px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #ddd;padding:10px 5px calc(10px + env(safe-area-inset-bottom));z-index:2}.nav button{border:0;background:none;color:#777;font-size:12px}.nav button.active{color:#111;font-weight:750}.section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 9px}.section-head h2{margin:0;font-size:18px}.item{border:1px solid #e2e2e2;border-radius:14px;padding:12px;margin:9px 0;background:white}.item p{margin:5px 0}.checkbox-row{display:flex;gap:9px;align-items:center;margin:11px 0}.hide{display:none!important}.notice{font-size:12px;color:#777;line-height:1.5}.empty{text-align:center;padding:25px;color:#777}.chip{background:#eee;border-radius:20px;padding:5px 9px;font-size:12px}.tools{display:flex;gap:8px;flex-wrap:wrap}a{color:inherit}summary{cursor:pointer;font-weight:650}details{margin-top:12px} @media(max-width:370px){.metric{padding:10px 7px}.metric .value{font-size:19px}.top h1{font-size:23px}}
</style></head><body><main><div class="top"><div><h1>OASIS Freight Tracker</h1><div class="muted small">Shipment Control Center</div></div><button class="pill" id="addTop">＋ Add</button></div><div class="metrics"><div class="metric"><div class="small">Shipments</div><div class="value" id="metricShip">0</div></div><div class="metric"><div class="small">Total TEU</div><div class="value" id="metricTeu">0</div></div><div class="metric"><div class="small">Est. Profit</div><div class="value" id="metricProfit">฿0</div></div></div><div id="page"></div><p class="notice">Data is saved on this device only. Export a backup regularly. Clearing website data or using a different browser can remove access to saved records.</p></main><div class="nav"><button data-page="bookings" class="active">▤<br>Bookings</button><button data-page="containers">▣<br>Containers</button><button data-page="tasks">☑<br>Tasks</button><button data-page="finance">฿<br>Finance</button><button data-page="settings">⚙<br>Settings</button></div><script>
'use strict';const KEY='oasis_freight_v1';const stages=['Pending','Booked','Picked Up','Loading','Returned','On Board','Completed','Rolled','Cancelled'];const tasks=['Booking Confirmed','Container Pick Up','Factory Loading','Return to Port','SI Submitted','VGM Submitted','BL Draft Checked','On Board'];let db={bookings:[],containers:[],expenses:[],checks:{},fx:33},page='bookings',filter='All',openBooking=null,form=null,editing=null;const $=id=>document.getElementById(id),money=n=>'฿'+(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=x=>Number(x)||0,uid=()=>String(Date.now())+Math.random().toString(36).slice(2,7);try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.bookings)){db={...db,...saved}}}catch(e){alert('Saved data could not be loaded. Please restore a backup.')}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Storage failed. Export your backup now.')}}function booking(id){return db.bookings.find(x=>x.id===id)}function profit(b){return num(b.qty)*num(b.sell)*num(b.fx||db.fx)-num(b.qty)*num(b.cost)*num(b.fx||db.fx)-db.expenses.filter(e=>e.bookingId===b.id).reduce((s,e)=>s+num(e.amount),0)}function totalTeu(){return db.bookings.filter(b=>b.status!=='Cancelled').reduce((s,b)=>s+num(b.qty)*(String(b.type).startsWith('40')?2:1),0)}function metrics(){ $('metricShip').textContent=db.bookings.filter(b=>b.status!=='Cancelled').length;$('metricTeu').textContent=totalTeu();$('metricProfit').textContent=money(db.bookings.filter(b=>b.status!=='Cancelled').reduce((s,b)=>s+profit(b),0))}function field(label,name,value='',type='text',full=false){return `<div class="field ${full?'full':''}"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'step="any"':''}></div>`}function selectField(label,name,opts,val){return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}function bookOptions(selected){return db.bookings.map(b=>`<option value="${esc(b.id)}" ${b.id===selected?'selected':''}>${esc(b.customer)} · ${esc(b.ref||b.id)}</option>`).join('')}function render(){metrics();document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));const p=$('page');if(form){p.innerHTML=renderForm();return}if(page==='bookings')p.innerHTML=renderBookings();if(page==='containers')p.innerHTML=renderContainers();if(page==='tasks')p.innerHTML=renderTasks();if(page==='finance')p.innerHTML=renderFinance();if(page==='settings')p.innerHTML=renderSettings()}
function renderBookings(){let rows=db.bookings.filter(b=>filter==='All'||b.status===filter);return `<div class="tabs">${['All','Booked','Loading','Returned','On Board','Completed'].map(s=>`<button data-filter="${s}" class="${s===filter?'active':''}">${s}</button>`).join('')}</div><input id="search" placeholder="Search customer / Booking No. / POD" aria-label="Search bookings"><div id="bookList">${bookCards(rows)}</div>`}function bookCards(rows){return rows.length?rows.map(b=>`<div class="card"><div class="card-title"><strong>${esc(b.customer)} · ${esc(b.ref||'No ref')}</strong><span class="status ${b.status.replace(/\s/g,'')}">${esc(b.status)}</span></div><p class="muted">${esc(b.pol||'LCH')} → ${esc(b.pod||'TBC')} · ETD ${esc(b.etd||'TBC')}</p><div class="row"><span>${num(b.qty)} × ${esc(b.type)}</span><strong>${money(profit(b))}</strong></div><div class="buttons"><button class="pill secondary" data-open="${b.id}">${openBooking===b.id?'Hide':'Details'}</button><button class="pill secondary" data-editbooking="${b.id}">Edit</button></div>${openBooking===b.id?bookingDetails(b):''}</div>`).join(''):'<div class="empty">No bookings yet. Tap ＋ Add to start.</div>'}function bookingDetails(b){let cont=db.containers.filter(c=>c.bookingId===b.id);return `<div class="detail"><div class="small muted">${esc(b.line||'')} · ${esc(b.vessel||'')} · ETA ${esc(b.eta||'TBC')}</div><div class="section-head"><h2>Tasks</h2></div>${tasks.map(t=>`<label class="checkbox-row"><input type="checkbox" data-check="${b.id}" data-task="${t}" ${db.checks[b.id+'|'+t]?'checked':''}> ${t}</label>`).join('')}<div class="section-head"><h2>Containers (${cont.length})</h2><button class="pill secondary" data-addcontainer="${b.id}">＋ Add</button></div>${cont.map(c=>`<div class="item"><strong>${esc(c.no||'Pending container no.')}</strong><p class="small muted">${esc(c.status)} · ${esc(c.driver||'No driver')} · ${esc(c.plate||'No plate')}</p><button class="pill secondary" data-editcontainer="${c.id}">Update</button></div>`).join('')||'<p class="muted small">No containers linked yet.</p>'}<div class="buttons"><button class="pill secondary" data-addexpense="${b.id}">＋ Expense</button><button class="pill danger" data-deletebooking="${b.id}">Delete Booking</button></div></div>`}
function renderContainers(){return `<div class="section-head"><h2>Container Tracker</h2><button class="pill" data-new="container">＋ Add</button></div>${db.containers.map(c=>`<div class="card"><div class="card-title"><strong>${esc(c.no||'TBC')}</strong><span class="status">${esc(c.status)}</span></div><p class="muted small">${esc(booking(c.bookingId)?.customer||'Unknown Booking')} · ${esc(c.plate||'No truck plate')}</p><div class="small">Driver: ${esc(c.driver||'—')} · Phone: ${esc(c.phone||'—')}</div><div class="small">Set ${esc(c.settemp||'—')}°C · Supply ${esc(c.supply||'—')}°C · Return ${esc(c.returntemp||'—')}°C</div><p class="small muted">Pickup: ${esc(c.pickup||'—')} · Gate-in: ${esc(c.gatein||'—')}</p><button class="pill secondary" data-editcontainer="${c.id}">Update</button></div>`).join('')||'<div class="empty">No containers yet.</div>'}`}
function renderTasks(){return `<div class="section-head"><h2>Documentation & Operations</h2></div>${db.bookings.filter(b=>b.status!=='Cancelled').map(b=>`<div class="card"><strong>${esc(b.customer)} · ${esc(b.ref||'No ref')}</strong><p class="small muted">ETD ${esc(b.etd||'TBC')} · ${esc(b.status)}</p>${tasks.map(t=>`<label class="checkbox-row"><input type="checkbox" data-check="${b.id}" data-task="${t}" ${db.checks[b.id+'|'+t]?'checked':''}> ${t}</label>`).join('')}</div>`).join('')||'<div class="empty">Add a booking to create tasks.</div>'}`}
function renderFinance(){return `<div class="section-head"><h2>Revenue & Expenses</h2><button class="pill" data-new="expense">＋ Expense</button></div><div class="card"><strong>Estimated Gross Profit</strong><div style="font-size:28px;font-weight:750;margin-top:8px">${money(db.bookings.filter(b=>b.status!=='Cancelled').reduce((s,b)=>s+profit(b),0))}</div><p class="notice">Profit = (Selling − Cost) × Quantity × FX − additional THB expenses. All amounts are estimates; taxes are not included.</p></div>${db.bookings.map(b=>`<div class="item"><div class="row"><strong>${esc(b.customer)} · ${esc(b.ref||'No ref')}</strong><strong>${money(profit(b))}</strong></div><p class="small muted">Revenue ${money(num(b.qty)*num(b.sell)*num(b.fx||db.fx))} · Base cost ${money(num(b.qty)*num(b.cost)*num(b.fx||db.fx))}</p><button class="pill secondary" data-addexpense="${b.id}">＋ Expense</button></div>`).join('')}${db.expenses.length?'<h3>Expense entries</h3>':''}${db.expenses.map(e=>`<div class="item row"><div><strong>${esc(e.name)}</strong><p class="small muted">${esc(booking(e.bookingId)?.ref||'Booking')} · ${esc(e.date||'')}</p></div><div style="text-align:right"><strong>${money(e.amount)}</strong><br><button class="pill danger" data-deleteexpense="${e.id}">Delete</button></div></div>`).join('')}`}
function renderSettings(){return `<div class="section-head"><h2>Settings & Backup</h2></div><div class="card"><h3>Data backup</h3><p class="muted small">Export your records to a JSON file and save it in Files/iCloud Drive. Import restores a backup and replaces current data.</p><div class="tools"><button class="pill" id="export">↓ Export Backup</button><label class="pill secondary" style="cursor:pointer">↑ Import Backup<input id="import" type="file" accept=".json,application/json" style="display:none"></label></div></div><div class="card"><h3>Install on iPhone</h3><p class="small">After hosting this app over HTTPS: open its URL in Safari → Share → Add to Home Screen.</p><p class="notice">This is local-only storage. Data is not shared between devices. Private browsing and clearing Safari website data can erase records. Do not use this version for sensitive customer data without appropriate security controls.</p></div>`}
function renderForm(){let kind=form.kind,rec=form.id?(kind==='booking'?booking(form.id):kind==='container'?db.containers.find(c=>c.id===form.id):db.expenses.find(e=>e.id===form.id)):{};rec=rec||{};let content='';if(kind==='booking')content=`${field('Booking No.','ref',rec.ref,'text',true)}${field('Customer *','customer',rec.customer,'text',true)}${field('POL','pol',rec.pol||'LCH')}${field('POD','pod',rec.pod)}${field('Shipping Line','line',rec.line)}${field('Vessel / Voyage','vessel',rec.vessel)}${field('ETD','etd',rec.etd,'date')}${field('ETA','eta',rec.eta,'date')}${field('Quantity *','qty',rec.qty||1,'number')}${selectField('Equipment','type',['40RH','40HC','40GP','20RF','20GP'],rec.type||'40RH')}${selectField('Status','status',stages,rec.status||'Booked')}${field('Selling rate (USD/container)','sell',rec.sell||0,'number')}${field('Base cost (USD/container)','cost',rec.cost||0,'number')}${field('FX THB/USD','fx',rec.fx||33,'number')}${field('Notes','notes',rec.notes,'text',true)}`;if(kind==='container')content=`<div class="field full"><label>Booking *</label><select name="bookingId" required>${bookOptions(rec.bookingId||form.bookingId)}</select></div>${field('Container No.','no',rec.no,'text',true)}${field('Seal No.','seal',rec.seal)}${selectField('Status','status',['Pending','Picked Up','At Factory','Loading','Loaded','Returned','On Board'],rec.status||'Pending')}${field('Driver','driver',rec.driver)}${field('Phone','phone',rec.phone,'tel')}${field('Truck plate','plate',rec.plate)}${field('Trailer plate','trailer',rec.trailer)}${field('Pickup date/time','pickup',rec.pickup,'datetime-local')}${field('Factory arrival','factory',rec.factory,'datetime-local')}${field('Loading completed','loaded',rec.loaded,'datetime-local')}${field('Gate-in date/time','gatein',rec.gatein,'datetime-local')}${field('Set Temp °C','settemp',rec.settemp,'number')}${field('Supply Temp °C','supply',rec.supply,'number')}${field('Return Temp °C','returntemp',rec.returntemp,'number')}${field('Vent setting','vent',rec.vent)}${field('Notes / Alarm','notes',rec.notes,'text',true)}`;if(kind==='expense')content=`<div class="field full"><label>Booking *</label><select name="bookingId" required>${bookOptions(rec.bookingId||form.bookingId)}</select></div>${field('Expense name *','name',rec.name,'text',true)}${field('Amount (THB) *','amount',rec.amount||0,'number')}${field('Date','date',rec.date||new Date().toISOString().slice(0,10),'date')}${field('Notes','notes',rec.notes,'text',true)}`;return `<div class="panel"><div class="row"><h2>${form.id?'Edit':'New'} ${kind==='booking'?'Booking':kind==='container'?'Container':'Expense'}</h2><button class="pill secondary" data-cancel>✕</button></div><form id="entryForm"><div class="fields">${content}</div><button class="fullbtn" type="submit">Save ${kind}</button></form></div>`}
function submitForm(f){let data=Object.fromEntries(new FormData(f).entries()),kind=form.kind,id=form.id||uid();if(kind==='booking'){if(!data.customer.trim()||num(data.qty)<=0){alert('Enter customer and valid quantity.');return}if(data.ref&&db.bookings.some(b=>b.ref===data.ref&&b.id!==id)){alert('Booking No. already exists.');return}data.qty=num(data.qty);data.sell=num(data.sell);data.cost=num(data.cost);data.fx=num(data.fx)||33}if(kind==='container'&&!data.bookingId){alert('Select a booking.');return}if(kind==='expense'){if(!data.bookingId||!data.name.trim()||num(data.amount)<0){alert('Enter booking, expense and valid amount.');return}data.amount=num(data.amount)}let arr=kind==='booking'?db.bookings:kind==='container'?db.containers:db.expenses;let index=arr.findIndex(x=>x.id===id);let record={...data,id};if(index>=0)arr[index]=record;else arr.unshift(record);save();form=null;page=kind==='booking'?'bookings':kind==='container'?'containers':'finance';render()}
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.page){page=t.dataset.page;form=null;render()}else if(t.id==='addTop'){form={kind:'booking'};render()}else if(t.dataset.new){if(t.dataset.new!=='booking'&&!db.bookings.length){alert('Add a booking first.');return}form={kind:t.dataset.new};render()}else if(t.dataset.cancel!==undefined){form=null;render()}else if(t.dataset.filter){filter=t.dataset.filter;render()}else if(t.dataset.open){openBooking=openBooking===t.dataset.open?null:t.dataset.open;render()}else if(t.dataset.editbooking){form={kind:'booking',id:t.dataset.editbooking};render()}else if(t.dataset.addcontainer||t.dataset.editcontainer){form=t.dataset.addcontainer?{kind:'container',bookingId:t.dataset.addcontainer}:{kind:'container',id:t.dataset.editcontainer};render()}else if(t.dataset.addexpense){form={kind:'expense',bookingId:t.dataset.addexpense};render()}else if(t.dataset.deletebooking){let id=t.dataset.deletebooking;if(confirm('Delete this booking and ALL linked containers, expenses and tasks?')){db.bookings=db.bookings.filter(x=>x.id!==id);db.containers=db.containers.filter(x=>x.bookingId!==id);db.expenses=db.expenses.filter(x=>x.bookingId!==id);Object.keys(db.checks).forEach(k=>{if(k.startsWith(id+'|'))delete db.checks[k]});save();render()}}else if(t.dataset.deleteexpense){if(confirm('Delete this expense?')){db.expenses=db.expenses.filter(x=>x.id!==t.dataset.deleteexpense);save();render()}}else if(t.id==='export'){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='OASIS-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
document.addEventListener('submit',e=>{if(e.target.id==='entryForm'){e.preventDefault();submitForm(e.target)}});document.addEventListener('change',async e=>{let t=e.target;if(t.dataset.check){db.checks[t.dataset.check+'|'+t.dataset.task]=t.checked;save()}if(t.id==='import'&&t.files?.[0]){try{let d=JSON.parse(await t.files[0].text());if(!Array.isArray(d.bookings)||!Array.isArray(d.containers)||!Array.isArray(d.expenses)||typeof d.checks!=='object'||!d.checks)throw Error('Invalid backup');if(confirm('Replace ALL current records with this backup?')){db={...db,...d};save();form=null;render()}}catch(err){alert('Invalid backup file: '+err.message)}t.value=''}});document.addEventListener('input',e=>{if(e.target.id==='search'){let q=e.target.value.toLowerCase();$('bookList').innerHTML=bookCards(db.bookings.filter(b=>(filter==='All'||b.status===filter)&&[b.customer,b.ref,b.pod,b.line].some(x=>String(x||'').toLowerCase().includes(q))))}});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
